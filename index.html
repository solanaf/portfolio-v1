<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solana Fernandez</title>
  
  <!--
    - favicon
  -->
  <link rel="shortcut icon" href="./assets/images/monkey.svg" type="image/x-icon">

  <!--
    - custom css link -->
  <link rel="stylesheet" href="./assets/css/main-style.css">

  <!--
    - google font link
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>

<body>

  <!--
    - #MAIN
  -->

  <main>

    <!--
      - #SIDEBAR
    -->

    <aside class="sidebar" data-sidebar>

      <div class="sidebar-info">

        <figure class="avatar-box">
          <img src="./assets/images/headshot.png" alt="Solana Fernandez" width="80">
        </figure>

        <div class="info-content">
          <h1 class="name" title="Solana Fernandez">Solana Fernandez</h1>

          <p class="title">Graduate Researcher</p>
        </div>

        <button class="info_more-btn" data-sidebar-btn>
          <span>Show Contacts</span>

          <ion-icon name="chevron-down"></ion-icon>
        </button>

      </div>

      <div class="sidebar-info_more">

        <div class="separator"></div>

        <ul class="contacts-list">

          <li class="contact-item">

            <div class="icon-box">
              <ion-icon name="mail-outline"></ion-icon>
            </div>

            <div class="contact-info">
              <p class="contact-title">Email</p>

              <a href="mailto:sbfernandez@ucsd.edu" class="contact-link">sbfernandez@ucsd.edu</a>
            </div>

          </li>

          <li class="contact-item">

            <div class="icon-box">
              <ion-icon name="phone-portrait-outline"></ion-icon>
            </div>

            <div class="contact-info">
              <p class="contact-title">Phone</p>

              <a href="tel:+17607166294" class="contact-link">+1 (760) 716-6294</a>
            </div>

          </li>

          <li class="contact-item">

            <div class="icon-box">
              <ion-icon name="location-outline"></ion-icon>
            </div>

            <div class="contact-info">
              <p class="contact-title">Location</p>

              <address>San Diego, CA 92126</address>
            </div>

          </li>

        </ul>

        <div class="separator"></div>

        <ul class="social-list">

          <li class="social-item">
            <a href="https://www.linkedin.com/in/solanaf/" class="social-link">
              <ion-icon name="logo-linkedin" size="large"></ion-icon>
            </a>
          </li>

          <li class="social-item">
            <a href="https://github.com/solanaf" class="social-link">
              <ion-icon name="logo-github" size="large"></ion-icon>
            </a>
          </li>


        </ul>

      </div>

    </aside>





    <!--
      - #main-content
    -->

    <div class="main-content">

      <!--
        - #NAVBAR
      -->

      <nav class="navbar">

        <ul class="navbar-list">

          <li class="navbar-item">
            <button class="navbar-link  active" data-nav-link data-page="about" type="button">About</button>
          </li>

          <li class="navbar-item">
            <button class="navbar-link" data-nav-link data-page="resume" type="button">Resume</button>
          </li>

          <li class="navbar-item">
            <button class="navbar-link" data-nav-link data-page="portfolio" type="button">Portfolio</button>
          </li>

          <li class="navbar-item">
            <button class="navbar-link" data-nav-link data-page="blog" type="button">Blog</button>
          </li>

        </ul>

      </nav>





            <!--
        - Dynamically loaded page content
      -->
      <div id="page-content" aria-live="polite"></div>



    </div>

  </main>






  <!--
    - custom js link
  -->
  <script src="./assets/js/script.js"></script>

  <!--
    - ionicon link
  -->
  <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>

</body>

</html>
